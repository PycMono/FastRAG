# FastRAG 本地开发环境
#
# 起 Elasticsearch（+可选 Kibana）。Docling Serve 也在这里，但**默认不启动**
# （镜像解压后约 14GB）——要解析文档时用 --profile docling 单独拉起。
# MySQL / Redis 本机已经在跑（3306 / 6379），直接用即可；
# 需要独立一套时，见文件末尾的注释块。
#
#   docker compose up -d --build                # 只起 ES
#   docker compose --profile docling up -d      # 再带上 Docling Serve(5001)
#   docker compose logs -f es
#   docker compose down            # 保留数据
#   docker compose down -v         # 连数据一起删

name: fastrag

services:
  es:
    build:
      context: ./deploy/es
      args:
        ES_VERSION: ${ES_VERSION:-9.5.5}
    image: fastrag/es:${ES_VERSION:-9.5.5}
    container_name: fastrag-es

    environment:
      - discovery.type=single-node          # 单节点，免去 bootstrap 集群流程
      - cluster.name=fastrag-local
      - xpack.security.enabled=false        # 本地开发关掉 TLS，省去证书配置
      - xpack.security.enrollment.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g           # 本地 1G 够用；生产至少一半物理内存

    ports:
      - "9200:9200"

    ulimits:
      memlock: { soft: -1, hard: -1 }       # 配合 bootstrap.memory_lock，禁止换出堆内存
      nofile:  { soft: 65536, hard: 65536 }

    volumes:
      - esdata:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Kibana 默认**不启动**——镜像 ~1.2GB，网络慢时先跳过。
  # 需要时：docker compose --profile kibana up -d
  kibana:
    profiles: ["kibana"]
    image: kibana:${ES_VERSION:-9.5.5}
    container_name: fastrag-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    ports:
      - "5601:5601"
    depends_on:
      es:
        condition: service_healthy

  # Docling Serve：自建解析后端（设计见 docs/superpowers/specs/2026-10-12-doc-parser-design.md §7）。
  #
  # 默认**不启动**——镜像解压后约 14GB，只有真要解析文档时才值得起。
  #   docker compose --profile docling up -d
  #
  # 首次启动会下载 Docling 的模型（视 PDF 后端而定，数百 MB 到 GB 级），所以给
  # /opt/app-root/src/.cache（= 镜像里的 HOME/.cache，HF 模型与 docling 产物都在这）
  # 挂了卷：不挂的话每次重建容器都要重新下一遍。
  #
  # ⚠️ 本机若已有一个手工 `docker run` 出来的 docling-serve 容器，先
  # `docker rm docling-serve`，否则它和这里的 fastrag-docling 会抢 5001 端口。
  docling:
    profiles: ["docling"]
    image: quay.io/docling-project/docling-serve:latest
    container_name: fastrag-docling
    command: ["docling-serve", "run"]
    environment:
      - DOCLING_SERVE_ENABLE_UI=1          # 带 /ui，手工试转换时好用
      # 同步接口在服务端等多久才放弃。默认只有 120s，且**超时只回 504**——
      # 客户端那边 config.json 的 parser.timeout_ms 是 20 分钟，比它长也没用：
      # 到点先挨刀的是这里。所以两边必须一起抬，且本值要 ≥ 客户端超时。
      - DOCLING_SERVE_MAX_SYNC_WAIT=1260   # 秒，21 分钟
    ports:
      - "5001:5001"
    volumes:
      - doclingcache:/opt/app-root/src/.cache
    # 16G 上限。不是"给它 16G 用"，是**给自己留个死法**：不加限时它处理扫描版
    # PDF（OCR）实测能吃到 8G+ 还在涨，真冲爆就轮到整个 VM 的内核挑一个杀——
    # 那时被挑中的很可能是 ES 或者 MySQL。加了限，死的是它自己，报 OOM。
    #
    # 这个数要**小于 Docker Desktop 的 VM 内存**才有意义。本机 VM 已从 12G 抬到
    # 24G（宿主 32G），见 docs 里的环境说明；若哪天把 VM 改小，这里要同步改小。
    mem_limit: 16g
    restart: unless-stopped

volumes:
  esdata:
  doclingcache:

# ---------------------------------------------------------------------------
