name: fastrag-evaluation
services:
  evaluator:
    build:
      context: ../../evaluation/ragas-service
    image: fastrag/ragas-evaluator:trial
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      EVAL_SERVICE_TOKEN: ${EVAL_SERVICE_TOKEN:?required}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      JUDGE_MODEL_VERSION: ${JUDGE_MODEL_VERSION:-unknown}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-https://api.openai.com/v1}
      # 证据排序按检索片段逐条评分，10 条上下文可能要接近 60 秒；留出推理输出余量。
      EVAL_METRIC_TIMEOUT_SECONDS: "120"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
